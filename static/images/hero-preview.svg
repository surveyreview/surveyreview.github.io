<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SurveyReview preview</title>
  <desc id="desc">A clean benchmark summary graphic showing four review dimensions and alignment results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f8fd"/>
      <stop offset="100%" stop-color="#dde8f7"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="110" y="90" width="1380" height="820" rx="42" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="110" y="90" width="1380" height="132" rx="42" fill="#0f172a"/>
  <circle cx="180" cy="156" r="34" fill="#1d4ed8"/>
  <circle cx="248" cy="156" r="34" fill="#0f766e"/>
  <text x="318" y="146" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">SurveyReview</text>
  <text x="318" y="185" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="20">Reviewer-aligned benchmark for survey evaluators</text>

  <g transform="translate(170 280)">
    <rect x="0" y="0" width="520" height="500" rx="30" fill="#f8fbff" stroke="#d7e2f1"/>
    <text x="36" y="52" fill="#0f172a" font-family="Source Serif 4, Georgia, serif" font-size="30" font-weight="700">Four dimensions</text>
    <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">
      <rect x="36" y="92" width="448" height="72" rx="18" fill="#e8f0ff"/>
      <text x="62" y="137" fill="#1d4ed8">Readability</text>
      <rect x="36" y="182" width="448" height="72" rx="18" fill="#e6fbf6"/>
      <text x="62" y="227" fill="#0f766e">Criticalness</text>
      <rect x="36" y="272" width="448" height="72" rx="18" fill="#eef2ff"/>
      <text x="62" y="317" fill="#4338ca">Comprehensiveness</text>
      <rect x="36" y="362" width="448" height="72" rx="18" fill="#f1f5f9"/>
      <text x="62" y="407" fill="#0f172a">Structure</text>
    </g>
  </g>

  <g transform="translate(750 280)">
    <rect x="0" y="0" width="550" height="236" rx="30" fill="#0f172a"/>
    <text x="36" y="52" fill="#ffffff" font-family="Source Serif 4, Georgia, serif" font-size="30" font-weight="700">Alignment result</text>
    <text x="36" y="104" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="20">Average MSE</text>
    <text x="36" y="158" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800">2.28 → 1.38</text>
    <rect x="36" y="180" width="330" height="14" rx="7" fill="#1e293b"/>
    <rect x="36" y="180" width="220" height="14" rx="7" fill="url(#ink)"/>
  </g>

  <g transform="translate(750 548)">
    <rect x="0" y="0" width="550" height="232" rx="30" fill="#f8fbff" stroke="#d7e2f1"/>
    <text x="36" y="52" fill="#0f172a" font-family="Source Serif 4, Georgia, serif" font-size="30" font-weight="700">Dataset snapshot</text>
    <g font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">
      <text x="36" y="108">675 survey papers</text>
      <text x="36" y="148">1,630 review reports</text>
      <text x="36" y="188">Structured score + rationale annotations</text>
    </g>
    <rect x="360" y="84" width="150" height="96" rx="20" fill="#dbeafe"/>
    <path d="M395 150h80" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round"/>
    <path d="M395 126h48" stroke="#0f766e" stroke-width="12" stroke-linecap="round"/>
    <path d="M395 102h64" stroke="#4338ca" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
